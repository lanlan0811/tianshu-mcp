[package]
name = "tianshu-mcp-logs"
version = "0.1.1-beta.4"
description = "Tianshu-mcp 日志台 —— 本地只读查看 MCP 运行日志与任务产物"
authors = ["lanlan0811"]
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"

[lib]
name = "tianshu_mcp_logs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
# 必须与 npm 侧 `@tauri-apps/plugin-opener`（package-lock 锁在 2.6.0）保持 **同 major/minor**：
# Tauri CLI 构建时会校验 npm 包与 Rust crate 的配对，不一致直接报错退出。
# Cargo 默认是 caret 语义（`"2"` → 会解析到更高的 2.7.0），且 Cargo.lock 不入库（由 CI 生成），
# 因此这里必须显式收窄到 `~2.6`。升级时请两侧一起改。
tauri-plugin-opener = "~2.6"
tauri-plugin-updater = "2"
# A8b 深链：`single-instance` 必须**最先注册**（插件顺序是硬性要求），并启用其 `deep-link` feature——
# 第二个实例的 URL 参数会**先转发给 deep-link 插件**（触发首实例的 `on_open_url`），再执行我们的回调。
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "2"
url = "2"
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true