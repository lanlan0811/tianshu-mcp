[package]
name = "tianshu-mcp-logs"
version = "0.1.0-beta.1"
description = "Tianshu-mcp 日志台 —— 本地只读查看 MCP 运行日志与任务产物"
authors = ["lanlan0811"]
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"

[lib]
name = "tianshu_mcp_logs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "2"
url = "2"
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true