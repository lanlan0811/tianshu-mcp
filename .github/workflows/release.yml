name: Release

# 触发：推送 v* tag 或手工（workflow_dispatch）。
# 严格保证 package.json.version === tag/输入版本 === tarball 文件名一致（R6）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本（必须与 package.json.version 一致）"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, verify version & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install, lint, test, build, strict stdio (up to 3 attempts on npm ci)
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "attempt $i/3: npm ci"
            if npm ci; then echo "npm ci succeeded on attempt $i/3"; break; fi
            if [ "$i" -lt 3 ]; then echo "npm ci attempt $i/3 failed, retrying in 5s..."; sleep 5; fi
            if [ "$i" -eq 3 ]; then echo "npm ci failed after 3 attempts"; exit 1; fi
          done
          npm run typecheck
          npm run lint
          npm test
          npm run build
          # 真实入口严格 stdio：stdout 只允许合法 MCP 消息（issue #1 门禁）
          npm run check:stdio
          npm run pack:check

      - name: Read package version
        id: pkgver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Resolve & validate target version
        id: version
        run: |
          PKG_VER="${{ steps.pkgver.outputs.version }}"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TARGET="${{ github.event.inputs.version }}"
            [ "$TARGET" = "$PKG_VER" ] || { echo "ERROR: input version '$TARGET' != package.json '$PKG_VER'"; exit 1; }
          else
            TARGET="${GITHUB_REF_NAME#v}"
            [ "$TARGET" = "$PKG_VER" ] || { echo "ERROR: tag '${GITHUB_REF_NAME}' != package.json version '$PKG_VER'"; exit 1; }
          fi
          echo "version=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Validated: tag/input version '$TARGET' matches package.json '$PKG_VER'"

      - name: npm pack (single tarball capture)
        id: pack
        run: |
          rm -f ./*.tgz
          npm pack --pack-destination "$RUNNER_TEMP"
          # 只捕获本次生成、与解析版本一致的那个 tarball
          TGZ="$RUNNER_TEMP/tianshu-mcp-${{ steps.version.outputs.version }}.tgz"
          test -f "$TGZ" || { echo "expected tarball $TGZ not found"; ls "$RUNNER_TEMP"/*.tgz; exit 1; }
          tar -tzf "$TGZ" > "$RUNNER_TEMP/package-list.txt"
          for REQUIRED in package/dist/agents/zcode/adapter.js package/dist/agents/zcode/run.js package/scripts/probe-zcode.mjs; do
            grep -qF "$REQUIRED" "$RUNNER_TEMP/package-list.txt" || { echo "missing $REQUIRED"; exit 1; }
          done
          echo "tarball=$TGZ" >> "$GITHUB_OUTPUT"

      - name: Install tarball into clean consumer & strict stdio check
        shell: bash
        # 消费者不安装开发依赖；验证分发包可独立运行且 stdout 合规，失败即阻断草稿创建。
        run: |
          CONSUMER="$RUNNER_TEMP/consumer"
          rm -rf "$CONSUMER"; mkdir -p "$CONSUMER"
          (cd "$CONSUMER" && npm init -y >/dev/null && npm install --no-audit --no-fund "${{ steps.pack.outputs.tarball }}")
          BIN="$CONSUMER/node_modules/tianshu-mcp/dist/index.js"
          test -f "$BIN" || { echo "installed bin missing: $BIN"; exit 1; }
          node scripts/check-stdio.mjs \
            --entry "$BIN" \
            --repo "$CONSUMER/node_modules/tianshu-mcp" \
            --expect-version "${{ steps.version.outputs.version }}" \
            --fixtures "$GITHUB_WORKSPACE/test/stub-agent"

      # Release 正文优先取版本发布说明文档 docs/release-v<version>.md（双语、含亮点与验证结果），
      # 缺失时回退为仅含 Full Changelog 的最小正文。避免只出自动生成的空壳 Changelog。
      - name: Build release body (prefer docs/release-v<version>.md)
        id: body
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          DOC="docs/release-v${VER}.md"
          BODY="$RUNNER_TEMP/release-body.md"
          PREV=$(git describe --tags --abbrev=0 "v${VER}^" 2>/dev/null || echo "")
          if [ -f "$DOC" ]; then
            cp "$DOC" "$BODY"
            echo "使用发布说明文档: $DOC"
          else
            echo "未找到 $DOC，正文仅含 Full Changelog"
            : > "$BODY"
          fi
          {
            echo
            echo "---"
            echo
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...v${VER}"
            else
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/v${VER}"
            fi
          } >> "$BODY"
          echo "path=$BODY" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: tianshu-mcp v${{ steps.version.outputs.version }}
          draft: false
          # 始终用上面组装的正文（含发布说明 + Full Changelog），不再依赖自动生成的空壳 notes
          body_path: ${{ steps.body.outputs.path }}
          generate_release_notes: false
          files: |
            ${{ steps.pack.outputs.tarball }}

      # Gitee 是镜像仓库，其发行版不在 GitHub Actions 默认范围内：用 Gitee OpenAPI 幂等补齐，
      # 避免出现「只有 tag、没有发行版」的不一致。
      # 需要在仓库 Secrets 配置 GITEE_TOKEN（Gitee → 设置 → 私人令牌，勾选 projects 权限）；
      # 未配置时脚本会明确提示并跳过，不使工作流失败。
      - name: Create/Update Gitee release (mirror, needs GITEE_TOKEN secret)
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          node scripts/gitee-release.mjs \
            "${{ steps.version.outputs.version }}" \
            "docs/release-v${{ steps.version.outputs.version }}.md"
