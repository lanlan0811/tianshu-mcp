name: Release

# 触发：推送 v* tag 或手工（workflow_dispatch）。
# 严格保证 package.json.version === tag/输入版本 === tarball 文件名一致（R6）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本（必须与 package.json.version 一致）"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, verify version & draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies (3 attempts)
        shell: bash
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci attempt $i failed, retrying..."; sleep 5
          done
          npm ci || { echo "npm ci failed after 3 attempts"; exit 1; }
          npm run typecheck
          npm test
          npm run build

      - name: Read package version
        id: pkgver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Resolve & validate target version
        id: version
        run: |
          PKG_VER="${{ steps.pkgver.outputs.version }}"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TARGET="${{ github.event.inputs.version }}"
            [ "$TARGET" = "$PKG_VER" ] || { echo "ERROR: input version '$TARGET' != package.json '$PKG_VER'"; exit 1; }
          else
            TARGET="${GITHUB_REF_NAME#v}"
            [ "$TARGET" = "$PKG_VER" ] || { echo "ERROR: tag '${GITHUB_REF_NAME}' != package.json version '$PKG_VER'"; exit 1; }
          fi
          echo "version=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Validated: tag/input version '$TARGET' matches package.json '$PKG_VER'"

      - name: npm pack (single tarball capture)
        id: pack
        run: |
          rm -f ./*.tgz
          npm pack --pack-destination "$RUNNER_TEMP"
          # 只捕获本次生成、与解析版本一致的那个 tarball
          TGZ="$RUNNER_TEMP/tianshu-mcp-${{ steps.version.outputs.version }}.tgz"
          test -f "$TGZ" || { echo "expected tarball $TGZ not found"; ls "$RUNNER_TEMP"/*.tgz; exit 1; }
          echo "tarball=$TGZ" >> "$GITHUB_OUTPUT"

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: tianshu-mcp v${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            ${{ steps.pack.outputs.tarball }}
