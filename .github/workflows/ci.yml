name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies (retry on transient network failures)
        uses: nick-fields/retry-action@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          command: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint
        run: npm run lint
      - name: Unit & integration & protocol tests (retry once on flake)
        uses: nick-fields/retry-action@v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_on: error
          command: npm test
      - name: Build (tsc → dist/)
        run: npm run build
      - name: Server boots & exits cleanly on stdin EOF
        run: timeout 20 node dist/index.js --no-skill-install < /dev/null; test $? -eq 0 -o $? -eq 124

  pack-check:
    name: npm pack dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (retry)
        uses: nick-fields/retry-action@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          command: npm ci
      - name: npm pack --dry-run
        run: npm run build && npm pack --dry-run
