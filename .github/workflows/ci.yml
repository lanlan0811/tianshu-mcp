name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies (3 attempts for transient network failures)
        shell: bash
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci attempt $i failed, retrying..."; sleep 5
          done
          npm ci || { echo "npm ci failed after 3 attempts"; exit 1; }
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint
        run: npm run lint
      - name: Unit & integration & protocol tests (2 attempts on flake)
        shell: bash
        run: |
          npm test && exit 0
          echo "tests failed on first attempt, retrying once..."; sleep 3
          npm test
      - name: Build (tsc → dist/)
        run: npm run build
      - name: Server boots & exits cleanly on stdin EOF
        run: timeout 20 node dist/index.js --no-skill-install < /dev/null; test $? -eq 0 -o $? -eq 124

  pack-check:
    name: npm pack dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (3 attempts)
        shell: bash
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci attempt $i failed, retrying..."; sleep 5
          done
          npm ci || { echo "npm ci failed after 3 attempts"; exit 1; }
      - name: Build & npm pack dry-run
        run: npm run build && npm pack --dry-run
