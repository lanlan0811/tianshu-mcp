name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies (up to 3 attempts)
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "attempt $i/3: npm ci"
            if npm ci; then
              echo "npm ci succeeded on attempt $i/3"
              exit 0
            fi
            if [ "$i" -lt 3 ]; then echo "npm ci attempt $i/3 failed, retrying in 5s..."; sleep 5; fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint
        run: npm run lint
      - name: Unit & integration & protocol tests (2 attempts on flake)
        shell: bash
        run: |
          npm test && exit 0
          echo "tests failed on first attempt, retrying once..."; sleep 3
          npm test
      - name: Build (tsc → dist/)
        run: npm run build
      - name: Server boots & exits cleanly on stdin EOF
        shell: bash
        # macOS 无 GNU timeout；用 node 起子进程喂 EOF，10s 未退出则判失败
        run: |
          node -e "
            const { spawn } = require('child_process');
            const cp = spawn(process.execPath, ['dist/index.js', '--no-skill-install'], { stdio: ['pipe','inherit','inherit'] });
            cp.stdin.end();
            const t = setTimeout(() => { console.error('server did not exit within 10s'); cp.kill(); process.exit(1); }, 10000);
            cp.on('exit', (c) => { clearTimeout(t); console.log('server exited code', c); process.exit(c === 0 ? 0 : 1); });
          "
      - name: No unexpected tracked diff after build
        shell: bash
        run: |
          MODIFIED=$(git status --porcelain | awk '{print $1}' | grep -v '^??' || true)
          if [ -z "$MODIFIED" ]; then
            echo "worktree clean (no tracked modifications)"
          else
            echo "unexpected tracked diff after build:"; git status --porcelain; exit 1
          fi

  pack-check:
    name: npm tarball content check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (up to 3 attempts)
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "attempt $i/3: npm ci"
            if npm ci; then echo "npm ci succeeded on attempt $i/3"; exit 0; fi
            if [ "$i" -lt 3 ]; then echo "npm ci attempt $i/3 failed, retrying in 5s..."; sleep 5; fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Build
        run: npm run build
      - name: Pack to temp and assert required contents
        run: |
          mkdir -p /tmp/pkg
          npm pack --pack-destination /tmp/pkg
          TGZ=$(ls /tmp/pkg/*.tgz | head -1)
          test -n "$TGZ"
          tar -tzf "$TGZ" | grep -q "package/dist/index.js" || { echo "dist/index.js missing"; exit 1; }
          tar -tzf "$TGZ" | grep -q "package/skills/tianshu-mcp/SKILL.md" || { echo "SKILL.md missing"; exit 1; }
          tar -tzf "$TGZ" | grep -q "package/README.md" || { echo "README.md missing"; exit 1; }
          tar -tzf "$TGZ" | grep -q "package/README.en.md" || { echo "README.en.md missing"; exit 1; }
          tar -tzf "$TGZ" | grep -q "package/LICENSE" || { echo "LICENSE missing"; exit 1; }
          echo "tarball content OK: $TGZ"
