  <text class="leaf" x="552" y="859">visual：像素比对 · 四联图</text>

  <!-- 工程化 -->
  <path class="edge" stroke="#8b5cf6" d="M200,585 C225,585 230,992 300,992"/>
  <rect x="300" y="969" width="190" height="46" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <text class="branch" fill="#6d28d9" x="316" y="997">工程化</text>
  <path class="edge" stroke="#8b5cf6" d="M490,992 C510,992 515,934 532,934"/>
  <path class="edge" stroke="#8b5cf6" d="M490,992 C510,992 515,992 532,992"/>
  <path class="edge" stroke="#8b5cf6" d="M490,992 C510,992 515,1050 532,1050"/>
