  <circle cx="536" cy="992" r="4" fill="#8b5cf6"/>
  <circle cx="536" cy="1050" r="4" fill="#8b5cf6"/>
  <text class="leaf" x="552" y="939">vitest 双 project · 1 756 用例</text>
  <text class="leaf" x="552" y="997">CI 3 OS × 3 Node · 严格 stdio</text>
  <text class="leaf" x="552" y="1055">6 个运行时依赖 · 双 tsconfig</text>

  <text class="subtitle" x="40" y="1092">依赖严格单向：L1 → L2 → L3 → {L4a, L4b} → L5；L4a 与 L4b 互不依赖，只在 L3 汇合</text>
</svg>
