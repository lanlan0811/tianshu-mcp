  <text class="leaf" x="552" y="585"><tspan class="leaf-key">L5 基础</tspan> 2 579 · config + util</text>

  <!-- 执行面 -->
  <path class="edge" stroke="#f59e0b" d="M200,585 C225,585 230,687 300,687"/>
  <rect x="300" y="664" width="190" height="46" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="branch" fill="#b45309" x="316" y="692">执行面 · 7 adapter</text>
  <path class="edge" stroke="#f59e0b" d="M490,687 C510,687 515,658 532,658"/>
