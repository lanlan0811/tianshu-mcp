  <path class="edge" stroke="#6366f1" d="M200,585 C225,585 230,435 300,435"/>
  <rect x="300" y="412" width="190" height="46" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text class="branch" fill="#4338ca" x="316" y="440">架构分层 45 904 行</text>
  <path class="edge" stroke="#6366f1" d="M490,435 C510,435 515,290 532,290"/>
