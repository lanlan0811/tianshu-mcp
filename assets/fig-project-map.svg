  <circle cx="536" cy="348" r="4" fill="#6366f1"/>
  <circle cx="536" cy="406" r="4" fill="#6366f1"/>
  <circle cx="536" cy="464" r="4" fill="#6366f1"/>
  <circle cx="536" cy="522" r="4" fill="#6366f1"/>
  <circle cx="536" cy="580" r="4" fill="#6366f1"/>
  <text class="leaf" x="552" y="295"><tspan class="leaf-key">L1 协议边</tspan> 2 026 · 8 个工具</text>
  <text class="leaf" x="552" y="353"><tspan class="leaf-key">L2 任务域</tspan> 2 088 · 10 态状态机</text>
