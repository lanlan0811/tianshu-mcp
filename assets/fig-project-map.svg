<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1120" viewBox="0 0 840 1120" role="img" aria-label="tianshu-mcp 项目结构导图">
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .title { font: 600 22px "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; fill: #64748b; }
      .root { font: 600 17px "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; fill: #ffffff; }
      .root-sub { font: 400 12px "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; fill: #cbd5e1; }
      .branch { font: 600 14px "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
      .leaf { font: 400 13px "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; fill: #334155; }
      .leaf-key { font: 600 13px "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; fill: #0f172a; }
      .edge { fill: none; stroke-width: 1.6; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="840" height="1120"/>

  <text class="title" x="40" y="44">tianshu-mcp · 项目结构导图</text>
  <text class="subtitle" x="40" y="70">src 45 904 行 / 168 文件 · 各层按代码量标注</text>

  <!-- 根节点 -->
  <rect x="40" y="541" width="160" height="88" rx="12" fill="#1e293b"/>
  <text class="root" x="60" y="573">tianshu-mcp</text>
  <text class="root-sub" x="60" y="595">MCP server（stdio）</text>
  <text class="root-sub" x="60" y="613">调度 · 执行 · 验收</text>

